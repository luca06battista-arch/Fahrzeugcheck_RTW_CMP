<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMP – RTW-Fahrzeugcheck</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mute:#5d6672;--line:#dde1e6;--acc:#d4202a;--ok:#1a7f4b;--okbg:#e4f4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2328;--tx:#eceff2;--mute:#9aa4af;--line:#323a42;--acc:#ff5a62;--ok:#4cc885;--okbg:#17301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2328;--tx:#eceff2;--mute:#9aa4af;--line:#323a42;--acc:#ff5a62;--ok:#4cc885;--okbg:#17301f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 2px}h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 12px;font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label.f{display:block;font-size:.8rem;color:var(--mute);margin-bottom:3px}
input[type=text],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
h2{font-size:1rem;margin:0 0 8px;display:flex;justify-content:space-between}h2 small{color:var(--mute);font-weight:400}
.item{display:flex;gap:12px;align-items:center;padding:10px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.item input{width:24px;height:24px;flex:none;accent-color:var(--ok)}.item.on{background:var(--okbg)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.bar div{height:100%;width:0;background:var(--ok);transition:width .2s}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{display:flex;flex-direction:column;border:2px dashed var(--line);border-radius:10px;overflow:hidden;cursor:pointer;min-height:110px;font-size:.85rem}
.ph span{padding:8px;text-align:center}.ph img{width:100%;height:100px;object-fit:cover;display:none}
.ph.on{border:2px solid var(--ok)}.ph.on img{display:block}.ph.on span{background:var(--okbg)}
button{font:inherit;font-weight:600;padding:12px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer;width:100%}
button:disabled{opacity:.4;cursor:not-allowed}button.sec{background:transparent;color:var(--tx);border:1px solid var(--line);margin-top:8px}
.log{font-size:.88rem;padding:8px 0;border-top:1px solid var(--line)}.log b{color:var(--ok)}.log img{width:56px;height:42px;object-fit:cover;border-radius:4px;margin:4px 4px 0 0}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}.logo{width:84px;height:84px;border-radius:50%;flex:none}.org{font-weight:800;font-size:1.1rem;color:var(--tx)}.org span{color:var(--acc)}
</style>
</head>

"Bremstest & Fahrwerk":["Fußbremse im Stand: Pedal fest, Druckpunkt vorhanden","Bremstest im Rollversuch auf dem Gelände: gerade, ohne Ziehen, ohne Geräusche","Feststellbremse hält das Fahrzeug sicher","Bremsflüssigkeitsstand in Ordnung","Kontrollleuchten (ABS, ESP, Bremse, Motor) erlöschen nach dem Start","Lenkung ohne übermäßiges Spiel, Servolenkung funktioniert","Keine Flüssigkeitsverluste unter dem Fahrzeug"],
"Patientenraum & Lagerung":["Fahrtrage: Fahrgestell, Hubfunktion, Bremsen, Rückenlehne, Gurte","Tragentisch rastet ein und verriegelt sicher","Tragestuhl funktionsfähig, Gurte intakt","Schaufeltrage, Vakuummatratze und Vakuumschienen","HWS-Immobilisation in allen Größen, Rettungskorsett","Beckenschlinge, Tourniquet, Verbandmaterial","Kinderrückhaltesystem / Kindersitz","Decken, Rettungsdecken, Wäsche","Sitze und Gurte der Begleitpersonen","Schränke und Schubladen verschlossen, Ladung gesichert","Heizung, Klima und Lüftung funktionieren","Patientenraum sauber, Abfallbehälter und Kanülenabwurf leer"],
"Medizintechnik":["Defibrillator/Monitor: Selbsttest bestanden, Akku und Ersatzakku geladen","Defi-Elektroden, EKG-Elektroden und Schreiberpapier","Blutdruckmessgerät mit allen Manschettengrößen","Beatmungsgerät: Funktionstest, Schläuche und Filter","Beatmungsbeutel mit Masken: Erwachsene, Kinder, Neugeborene","Absaugpumpe fest eingebaut und tragbar, Katheter vorhanden","Sauerstoff: fest eingebaute Flaschen ausreichend gefüllt","Mobile Sauerstoffflasche, Druckminderer, Flowmeter, dicht","Intubationsbesteck, Larynxtubus, Güdel- und Wendl-Tuben","Infusions- und Spritzenpumpe geladen","Blutzucker- und Fiebermessgerät","Roter Rucksack: nach gültiger Beladeliste ausgestattet und einsatzbereit","Blauer Rucksack: nach gültiger Beladeliste ausgestattet und einsatzbereit","Kindernotfallrucksack: nach gültiger Beladeliste ausgestattet und einsatzbereit","Traumatasche: nach gültiger Beladeliste ausgestattet und einsatzbereit","MANV-Tasche: nach gültiger Beladeliste ausgestattet und einsatzbereit","Notfallkoffer vollständig und gesichert"],
"Medikamente & Infusionen":["Medikamentenbestand laut Bestandsliste vollständig","Verfallsdaten geprüft","Betäubungsmittel: Bestand, Plombe und Dokumentation","Infusionslösungen und Infusionsbestecke","Kühlschranktemperatur im Sollbereich (2–8 °C)"],
"Funk, Kommunikation & Hygiene":["Digitalfunk im Fahrzeug angemeldet, Funktest mit ILS Ortenau","Handfunkgeräte und Meldeempfänger geladen","Navigation und Tablet / Einsatzdokumentation einsatzbereit","Persönliche Schutzausrüstung: Jacke, Handschuhe, Schutzbrille, FFP2","Händedesinfektion und Flächendesinfektion aufgefüllt","Infektionsschutz-Set und Entsorgungsbeutel"]};
const $=id=>document.getElementById(id);const photos={};let total=0,logs=[];
for(const[w,l]of Object.entries(FZ)){const g=document.createElement("optgroup");g.label=w;l.forEach(([n,s])=>{const o=document.createElement("option");o.value=n;o.dataset.s=s;o.textContent=n+(s==16?" (08–24 Uhr)":" (24/7)");g.appendChild(o)});$("rtw").appendChild(g)}
function fillShifts(){const s=$("rtw").selectedOptions[0].dataset.s;$("schicht").innerHTML=SH[s].map(x=>"<option>"+x+"</option>").join("")}
function photoCard(title,list,pre){const c=document.createElement("div");c.className="card";c.innerHTML=`<h2>${title}<small class="gc"></small></h2><div class="pg"></div>`;
 list.forEach((t,i)=>{const id=pre+i;const l=document.createElement("label");l.className="ph";l.dataset.id=id;l.innerHTML=`<img alt=""><span>📷 ${t}</span><input type="file" accept="image/*" capture="environment" hidden>`;
  l.querySelector("input").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);photos[id]=cv.toDataURL("image/jpeg",.7);l.querySelector("img").src=photos[id];l.classList.add("on");update()};im.src=URL.createObjectURL(f)};
  c.querySelector(".pg").appendChild(l)});$("photos").appendChild(c)}
photoCard("Fotos außen (Pflicht)",OUT,"o");photoCard("Fotos innen (Pflicht)",IN,"i");
for(const[t,items]of Object.entries(CHECKS)){const c=document.createElement("div");c.className="card";c.innerHTML=`<h2>${t}<small class="gc"></small></h2>`;
 items.forEach(x=>{total++;const l=document.createElement("label");l.className="item";l.innerHTML=`<input type="checkbox"><span>${x}</span>`;c.appendChild(l)});$("lists").appendChild(c)}
const NP=OUT.length+IN.length;
function update(){const b=[...document.querySelectorAll(".item input")];const n=b.filter(x=>x.checked).length,p=Object.keys(photos).length;
 b.forEach(x=>x.parentElement.classList.toggle("on",x.checked));
 document.querySelectorAll("#lists .card").forEach(c=>{const q=c.querySelectorAll("input");c.querySelector(".gc").textContent=[...q].filter(x=>x.checked).length+" / "+q.length});
 const ph=document.querySelectorAll("#photos .card");ph[0].querySelector(".gc").textContent=OUT.filter((_,i)=>photos["o"+i]).length+" / "+OUT.length;ph[1].querySelector(".gc").textContent=IN.filter((_,i)=>photos["i"+i]).length+" / "+IN.length;
 $("fill").style.width=((n+p)/(total+NP)*100)+"%";$("count").textContent=`Checkpunkte ${n}/${total} · Fotos ${p}/${NP}`;
 $("done").disabled=!(n==total&&p==NP&&$("nfs").value.trim())}
$("rtw").onchange=fillShifts;$("lists").addEventListener("change",update);$("nfs").oninput=update;
$("done").onclick=()=>{const t=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),nt=$("note").value.trim().replace(/</g,"&lt;");
 logs.unshift(`<div class="log"><b>✔ ${$("rtw").value}</b> · ${$("schicht").value} · ${t} Uhr<br>${$("nfs").value.replace(/</g,"&lt;")}${$("rs").value?" / "+$("rs").value.replace(/</g,"&lt;"):""}${nt?"<br>Bemerkung: "+nt:""}<br>${Object.values(photos).map(s=>`<img src="${s}" alt="">`).join("")}</div>`);
 $("log").innerHTML=logs.join("");doReset()};
function doReset(){document.querySelectorAll(".item input").forEach(b=>b.checked=false);for(const k in photos)delete photos[k];document.querySelectorAll(".ph").forEach(l=>{l.classList.remove("on");l.querySelector("input").value=""});$("note").value="";update();window.scrollTo({top:0,behavior:"smooth"})}
$("reset").onclick=doReset;fillShifts();update();
</script>
